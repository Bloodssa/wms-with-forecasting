upload_max_filesize = 25M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; opcache - validate_timestamps=0 means you must restart the container
; (or run `docker exec ... kill -USR2 1`) after deploying new code, which
; Railway/Render already do on every deploy, so this is safe.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
